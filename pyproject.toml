[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erp-automation"
version = "0.1.0"
description = "Monitoramento e automacao de processos do ERP via ERPAPI"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14",
    "pydantic-settings>=2.6",
    "tzdata; sys_platform == 'win32'",
    "httpx2>=2.0",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ia = [
    "scikit-learn>=1.5",
]
dev = [
    "scikit-learn>=1.5",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "starlette>=1.2",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-openpyxl>=3.1",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requer um PostgreSQL acessivel (pulado se nao houver)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
