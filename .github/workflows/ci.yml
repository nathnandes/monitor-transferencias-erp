name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp_automation
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp_automation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://erp:erp_ci@localhost:5432/erp_automation
      ERPAPI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Auditoria das dependencias
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r constraints.txt --strict
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Migrations
        run: alembic upgrade head
      - name: Testes
        run: pytest --cov --cov-report=term --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Auditoria das dependencias
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm run test:coverage
      - name: Build
        run: npx vite build
